# 仅 Production：push 到 main 时 SSH 部署；也可在 Actions 里手动运行。
#
# GitHub：Settings → Secrets and variables → Actions → Repository secrets
#
# 必填：
#   SERVER_HOST         服务器公网 IP 或域名
#   SERVER_USER         SSH 用户（如 root）
#   SERVER_SSH_KEY      部署用私钥全文
#   SERVER_DEPLOY_PATH  项目在服务器上的绝对路径
#   PM2_APP_NAME        PM2 进程名（与 pm2 list 里 name 一致）
#
# 可选：GIT_BRANCH 不设则默认拉取 main（若你正式分支不叫 main，可建该 Secret）
#
# 服务器上若跑过 next build 等，可能产生对已跟踪文件的本地修改（如 next-env.d.ts），
# git pull 会拒绝合并。以下为与 origin 强制对齐（不影响未跟踪文件如 .env.production）。
#
# SSH 非 22 时：在 appleboy/ssh-action 的 with: 下增加 port: 端口
#
name: Deploy to server (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            PM2_NAME="${{ secrets.PM2_APP_NAME }}"
            BRANCH="${{ secrets.GIT_BRANCH }}"
            if [ -z "$BRANCH" ]; then BRANCH="main"; fi
            cd "$DEPLOY_PATH"

            # 服务器偶发连不上 GitHub（Empty reply），重试几次
            fetch_ok=0
            for i in 1 2 3 4 5; do
              if git fetch origin "$BRANCH"; then
                fetch_ok=1
                break
              fi
              echo "git fetch failed (attempt $i), retry in $((i * 5))s..."
              sleep $((i * 5))
            done
            if [ "$fetch_ok" -ne 1 ]; then
              echo "git fetch failed after retries"
              exit 1
            fi

            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm ci
            npm run build
            if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
              pm2 restart "$PM2_NAME"
            else
              pm2 start npm --name "$PM2_NAME" -- start
              pm2 save
            fi
